
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 | Page Not Found - Ayush</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #e8f0ff;
            color: #222;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .error-card {
            background: white;
            padding: 45px 30px;
            border-radius: 20px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        h1 {
            color: #1746a2;
            font-size: 100px;
            margin-bottom: 10px;
        }

        h2 {
            color: #1746a2;
            margin-bottom: 15px;
        }

        p {
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        a {
            display: inline-block;
            background: #1746a2;
            color: white;
            text-decoration: none;
            padding: 14px 25px;
            border-radius: 10px;
            transition: 0.3s;
        }

        a:hover {
            background: #0b255c;
            transform: scale(1.05);
        }

        @media (max-width: 500px) {
            h1 {
                font-size: 75px;
            }
        }
    </style>
</head>

<body>

    <div class="error-card">

        <h1>404</h1>

        <h2>Oops! Page Not Found</h2>

        <p>
            Sorry! The page you are looking for
            doesn't exist or may have been moved.
        </p>

        <a href="index.html">Back to Home</a>

    </div>

</body>
</html>
